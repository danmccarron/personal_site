<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name – Personal Site</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2324376B'/%3E%3Crect x='6' y='6' width='5' height='20' fill='%23BDD0B4'/%3E%3Crect x='11' y='6' width='5' height='20' fill='%23C3D2E8'/%3E%3Crect x='16' y='6' width='5' height='20' fill='%23EFCFB8'/%3E%3Crect x='21' y='6' width='5' height='20' fill='%23F1E1AE'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F0E1; --ink: #1E2B45; --muted: #55627A; --accent: #27408B; --rule: #DCD2B9; --panel: #EFE8D4;
  --navy: #24376B; --sage: #BDD0B4; --sky: #C3D2E8; --peach: #EFCFB8; --butter: #F1E1AE; --sand: #E6DCC0;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --text: "Literata", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #172036; --ink: #EFE8D6; --muted: #A9B4C6; --accent: #A9C4F2; --rule: #33415F; --panel: #1F2B47;
    --navy: #9DB4EA; --sage: #4A6753; --sky: #3F5782; --peach: #7A5A4A; --butter: #7A6A3A; --sand: #2A3858;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #172036; --ink: #EFE8D6; --muted: #A9B4C6; --accent: #A9C4F2; --rule: #33415F; --panel: #1F2B47;
  --navy: #9DB4EA; --sage: #4A6753; --sky: #3F5782; --peach: #7A5A4A; --butter: #7A6A3A; --sand: #2A3858;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 16px + 1.5rem); scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .chev { transition: none !important; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 1.0625rem; line-height: 1.7; }
body { padding-top: 16px; }
body::before {
  content: ""; position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  height: calc(16px + env(safe-area-inset-top, 0px));
  background-color: var(--bg); background-image: var(--bar, none); background-repeat: no-repeat;
  background-size: 6600px 16px; background-position: var(--bx, 0px) 100%;
}
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

.layout {
  display: grid; grid-template-columns: 17rem minmax(0, 1fr); gap: 0 4rem; max-width: 66rem; margin: 0 auto; padding: 0 1.5rem;
  grid-template-areas: "mast mast" "side main";
}
.masthead { grid-area: mast; display: flex; align-items: center; justify-content: space-between; gap: 2rem; padding: 4rem 0 2.5rem; }
.masthead .tag { margin: 0; max-width: 30rem; }
.masthead .photo { width: 9rem; flex: none; }

/* Sidebar */
.side { grid-area: side; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px + 1rem); align-self: start; padding: 0 0 2rem; }
.name { font-family: var(--display); font-weight: 700; font-size: 2.4rem; line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 .6rem; }
.tag { color: var(--muted); font-size: .98rem; line-height: 1.5; }
.nav { display: flex; flex-direction: column; gap: .15rem; }
.nav a {
  --c: var(--sage);
  font-family: var(--display); font-weight: 500; font-size: 1.1rem; text-decoration: none; color: var(--muted);
  padding: .35rem .9rem; border-left: 6px solid var(--c); border-radius: 0 4px 4px 0;
}
.nav a:nth-child(2) { --c: var(--sky); }
.nav a:nth-child(3) { --c: var(--peach); }
.nav a:nth-child(4) { --c: var(--butter); }
.nav a:hover { color: var(--ink); background: var(--panel); }
.nav a[aria-current="true"] { color: var(--ink); background: var(--c); }
.contact { margin-top: 2rem; font-size: .95rem; color: var(--muted); }
.contact a { display: block; }

/* Content */
main { grid-area: main; padding: 0 0 6rem; }
section { padding-bottom: 4.5rem; }
#career { --tint: var(--sage); }
#projects { --tint: var(--sky); }
#blog { --tint: var(--peach); }
#about { --tint: var(--butter); }
h2 { font-family: var(--display); font-weight: 700; font-size: 2rem; letter-spacing: -0.01em; margin: 0 0 1.75rem; line-height: 1.15; }
h2::after {
  content: ""; display: block; width: 8rem; height: 12px; margin-top: .6rem; border-radius: 2px;
  background: repeating-linear-gradient(135deg, var(--tint) 0 7px, var(--sand) 7px 14px);
}
h3 { font-family: var(--display); font-weight: 500; font-size: 1.2rem; margin: 0; line-height: 1.3; }
p { margin: 0 0 1rem; max-width: 62ch; }
.meta { color: var(--muted); font-size: .92rem; }

/* Expandable career entries */
.entry > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 1rem; align-items: start; }
.entry > summary::-webkit-details-marker { display: none; }
.entry .t { grid-column: 1; font-family: var(--display); font-weight: 500; font-size: 1.2rem; line-height: 1.3; }
.entry .meta { grid-column: 1; margin: .1rem 0 .4rem; }
.entry .blurb { grid-column: 1; max-width: 62ch; }
.entry .chev {
  grid-column: 2; grid-row: 1; width: .6rem; height: .6rem; margin: .45rem .25rem 0 0;
  border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(45deg); transition: transform .2s;
}
.entry[open] > summary .chev { transform: rotate(-135deg); margin-top: .75rem; }
.entry .more { padding-top: .6rem; }
.entry .more ul { margin: 0; padding-left: 1.2rem; max-width: 62ch; }
.entry .more li { margin-bottom: .35rem; }

.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; border-radius: 4px;
  background: repeating-linear-gradient(180deg, var(--sage) 0 10px, var(--sand) 10px 20px);
}
.timeline > li { position: relative; padding: 0 0 2rem 2.25rem; }
.timeline > li::before {
  content: ""; position: absolute; left: -4px; top: .4rem; width: 16px; height: 16px;
  border-radius: 50%; background: var(--navy); border: 3px solid var(--bg);
}
.timeline > li:last-child { padding-bottom: 0; }
.subhead { font-family: var(--display); font-weight: 700; font-size: 1.5rem; margin: 3rem 0 1.25rem; }
.edu { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
.edu > li { padding: 1.1rem 1.25rem; background: var(--panel); border-left: 8px solid var(--sky); border-radius: 0 6px 6px 0; }
.edu > li:nth-child(2n) { border-left-color: var(--butter); }

/* Projects */
.projects { list-style: none; margin: 0; padding: 0; }
.projects li {
  --c: var(--sage);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; padding: 1.1rem 1.25rem; margin-bottom: .75rem;
  background: var(--panel); border-left: 8px solid var(--c); border-radius: 0 6px 6px 0;
}
.projects li:nth-child(3n+2) { --c: var(--sky); }
.projects li:nth-child(3n+3) { --c: var(--peach); }
.projects p { margin: .25rem 0 0; color: var(--muted); font-size: 1rem; }
.projects .stack {
  align-self: start; justify-self: end; font-size: .88rem; color: var(--ink); background: var(--c);
  padding: .15rem .75rem; border-radius: 999px; white-space: nowrap;
}

/* Blog */
.posts { list-style: none; margin: 0; padding: 0; }
.posts li { position: relative; overflow: hidden; padding: 1.5rem 1.25rem 1.1rem; margin-bottom: 1rem; background: var(--panel); border-radius: 6px; }
.posts li::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 8px;
  background: repeating-linear-gradient(135deg, var(--peach) 0 8px, var(--butter) 8px 16px);
}
.posts a.title { font-family: var(--display); font-weight: 500; font-size: 1.2rem; color: var(--ink); text-decoration-color: var(--accent); }
.posts p { margin: .2rem 0 0; color: var(--muted); }

/* About */
.about { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
.photo {
  width: 9rem; aspect-ratio: 1; border-radius: 50%; border: 5px solid var(--sky);
  background: repeating-linear-gradient(45deg, var(--sage) 0 10px, var(--sand) 10px 20px);
  display: grid; place-items: center; color: var(--ink); font-weight: 600; font-size: .8rem; text-align: center; padding: .5rem;
}
.photo.wide { width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; }
.facts { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1.25rem 0 0; padding: 0; list-style: none; font-size: .95rem; }
.facts li { padding: .15rem .85rem; border-radius: 999px; background: var(--butter); color: var(--ink); }
.facts li:nth-child(3n+2) { background: var(--sky); }
.facts li:nth-child(3n+3) { background: var(--sage); }

/* Blog post pages */
main.reading > section { display: none; }
.post { display: none; --tint: var(--peach); padding-bottom: 4.5rem; }
.post.open { display: block; }
.post .back { display: inline-block; margin-bottom: 1.5rem; font-family: var(--display); font-weight: 500; }
.post h2 { font-size: 2.3rem; }
.post .meta { margin: 0 0 1.5rem; }

footer { color: var(--muted); font-size: .9rem; padding: 0 0 2rem; }
footer::before {
  content: ""; display: block; height: 12px; margin-bottom: 1rem; border-radius: 2px;
  background: var(--bar-foot, var(--sage));
}

@media (max-width: 52rem) {
  .layout { display: block; padding: 0 1.25rem; }
  .side { position: static; padding: 0 0 1rem; }
  .masthead { padding: 2rem 0 1.5rem; gap: 1rem; }
  .masthead .photo { width: 6rem; font-size: .7rem; }
  .name { font-size: 2rem; }
  .nav { flex-direction: row; flex-wrap: wrap; gap: .25rem 1.25rem; }
  .nav a { padding: .25rem .7rem; border-left: 0; border-bottom: 4px solid var(--c); border-radius: 4px 4px 0 0; }
  .contact { margin-top: 1.25rem; }
  main { padding-top: 2rem; }
  .projects li { grid-template-columns: 1fr; gap: .25rem; }
  .projects .stack { justify-self: start; }
}
</style>
<script>
(function () {
  var c = ['--navy', '--sage', '--sand', '--sky', '--peach', '--butter'];
  function bar() {
    var s = [], last = -1, x = 0, w = 22;
    for (var i = 0; i < 300; i++) {
      var k;
      do { k = Math.floor(Math.random() * c.length); } while (k === last);
      last = k;
      s.push('var(' + c[k] + ') ' + x + 'px ' + (x + w) + 'px');
      x += w;
    }
    return 'linear-gradient(90deg,' + s.join(',') + ')';
  }
  var r = document.documentElement.style;
  r.setProperty('--bar', bar());
  r.setProperty('--bar-foot', bar());
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var ticking = false;
    var update = function () {
      r.setProperty('--bx', (-window.scrollY * 0.25) + 'px');
      ticking = false;
    };
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    }, { passive: true });
    update();
  }
})();
</script>
</head>
<body>
<div class="layout">
  <header class="masthead">
    <div>
      <h1 class="name" id="site-name"></h1>
      <p class="tag" id="site-tagline"></p>
    </div>
    <div class="photo" id="head-photo" role="img"></div>
  </header>
  <aside class="side">
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="contact" id="contact"></div>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ============================================================
   EDIT YOUR CONTENT HERE. The page is built from this object.
   To add something, add an entry to the matching list below.
   ============================================================ */
const SITE = {
  name: "Daniel McCarron",
  tagline: "Product manager based in Oxford, with expertise in the web domain industry and consumer finance. Passionate about music, tech and food.",
  headerPhotoLabel: "Add your photo here",
  contact: {
    email: "career@danm.cc",
    links: [{ label: "Find me elsewhere", href: "#about" }]
  },
  footer: "© 2026",

  // Order here is the order of sections and menu links.
  sections: [
    { id: "career", title: "Career" },
    { id: "projects", title: "Projects" },
    { id: "blog", title: "Blog" },
    { id: "about", title: "About Me" }
  ],

  career: {
    jobs: [
      {
        title: "Product Manager, Nominet",
        dates: "2023 – Present",
        summary: "Description.",
        more: [
          "More",
          "More",
          "More"
        ]
      },
      {
        title: "Product Manager, Account Technologies",
        dates: "2020 – 2023",
        summary: "Description.",
        more: [
          "----",
        ]
      },
      {
        title: "Data Analyst, Account Technologies",
        dates: "2017 – 2019",
        summary: "----.",
        more: [
      ]
      }
    ],
    educationHeading: "Education",
    education: [
      {
        title: "Higher Education: BSc Mathematics and Phyiscs, University of St Andrews",
        dates: "2013 – 2016",
        summary: "Achieved a 2:1. Final year project analysed and recreated waves on a guitar string.",
        more: ["Add modules, awards or projects you want to mention here."]
      },
      {
        title: "School: Aylesbury Grammar School",
        dates: "",
        summary: "",
        more: ["Achieved 5 full A-levels in Maths, Further Maths, Physics, Chemistry and Music (A*AABB respectively)."]
      }
    ]
  },

  projects: [
    { name: "Project Name", url: "#", description: "Project description", stack: "Tech Stack" }
  ],

  blog: [
    {
      id: "blog-id", // becomes the link #post-design-system
      title: "Blog Title",
      date: "12 September 2026",
      summary: "Summary.",
      body: [
        "Here's the body"
      ]
    }
  ],

  about: {
    photoLabel: "Add a landscape photo here",
    paragraphs: [
      "Hello, I’m Dan."
    ],
    facts: [
      "Based in Oxford, England",
      "Currently learning: Mandolin",
      "Open to: freelance projects and good conversation"
    ]
  }
};

/* ===================== Rendering (no need to edit) ===================== */
function h(tag, props, kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    if (k === 'class') e.className = props[k];
    else if (k === 'text') e.textContent = props[k];
    else e.setAttribute(k, props[k]);
  }
  (kids || []).forEach(c => { if (c) e.appendChild(c); });
  return e;
}
const bullets = items => h('ul', {}, items.map(t => h('li', { text: t })));

function entry(item) {
  const more = item.more && item.more.length ? h('div', { class: 'more' }, [bullets(item.more)]) : null;
  const sum = h('summary', {}, [
    h('span', { class: 't', text: item.title }),
    h('span', { class: 'meta', text: item.dates }),
    h('span', { class: 'blurb', text: item.summary }),
    h('span', { class: 'chev', 'aria-hidden': 'true' })
  ]);
  return h('details', { class: 'entry' }, [sum, more]);
}

const renderers = {
  career(d) {
    const parts = [
      h('h2', { text: 'Career' }),
      h('ol', { class: 'timeline' }, d.jobs.map(j => h('li', {}, [entry(j)])))
    ];
    if (d.education && d.education.length) {
      parts.push(h('h3', { class: 'subhead', text: d.educationHeading || 'Education' }));
      parts.push(h('ul', { class: 'edu' }, d.education.map(e => h('li', {}, [entry(e)]))));
    }
    return parts;
  },
  projects(list) {
    return [h('h2', { text: 'Projects' }), h('ul', { class: 'projects' }, list.map(p =>
      h('li', {}, [
        h('div', {}, [
          h('h3', {}, [h('a', { href: p.url || '#', text: p.name })]),
          h('p', { text: p.description })
        ]),
        p.stack ? h('span', { class: 'stack', text: p.stack }) : null
      ])))];
  },
  blog(list) {
    return [h('h2', { text: 'Blog' }), h('ul', { class: 'posts' }, list.map(p =>
      h('li', {}, [
        h('a', { class: 'title', href: '#post-' + p.id, text: p.title }),
        h('p', { class: 'meta', text: p.date }),
        h('p', { text: p.summary })
      ])))];
  },
  about(d) {
    return [h('h2', { text: 'About Me' }), h('div', { class: 'about' }, [
      h('div', { class: 'photo wide', role: 'img', 'aria-label': d.photoLabel, text: d.photoLabel }),
      h('div', {}, [
        ...d.paragraphs.map(t => h('p', { text: t })),
        h('ul', { class: 'facts' }, d.facts.map(t => h('li', { text: t })))
      ])
    ])];
  }
};

(function build() {
  document.getElementById('site-name').textContent = SITE.name;
  document.getElementById('site-tagline').textContent = SITE.tagline;
  const hp = document.getElementById('head-photo');
  hp.textContent = SITE.headerPhotoLabel;
  hp.setAttribute('aria-label', SITE.headerPhotoLabel);

  const nav = document.getElementById('nav');
  SITE.sections.forEach(s => nav.appendChild(h('a', { href: '#' + s.id, text: s.title })));

  const contact = document.getElementById('contact');
  contact.appendChild(h('a', { href: 'mailto:' + SITE.contact.email, text: SITE.contact.email }));
  SITE.contact.links.forEach(l => contact.appendChild(h('a', { href: l.href, text: l.label })));

  const main = document.getElementById('main');
  SITE.sections.forEach(s => {
    if (renderers[s.id]) main.appendChild(h('section', { id: s.id }, renderers[s.id](SITE[s.id])));
  });
  SITE.blog.forEach(p => {
    main.appendChild(h('article', { class: 'post', id: 'post-' + p.id }, [
      h('a', { class: 'back', href: '#blog', text: 'Back to Blog' }),
      h('h2', { text: p.title }),
      h('p', { class: 'meta', text: p.date }),
      ...p.body.map(t => h('p', { text: t }))
    ]));
  });
  main.appendChild(h('footer', { text: SITE.footer }));
  document.title = SITE.name + ' – Personal Site';
})();

/* Active menu link while scrolling */
(function () {
  const links = Array.from(document.querySelectorAll('.nav a'));
  const sections = links.map(a => document.querySelector(a.getAttribute('href')));
  function setActive(id) {
    links.forEach(a => {
      if (a.getAttribute('href') === '#' + id) a.setAttribute('aria-current', 'true');
      else a.removeAttribute('aria-current');
    });
  }
  setActive(SITE.sections[0].id);
  if (!('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
  }, { rootMargin: '-30% 0px -60% 0px' });
  sections.forEach(s => { if (s) io.observe(s); });
})();

/* Blog post pages: #post-<id> shows one post */
(function () {
  const main = document.getElementById('main');
  const posts = document.querySelectorAll('.post');
  const navLinks = document.querySelectorAll('.nav a');
  const baseTitle = document.title;
  function route() {
    const id = decodeURIComponent(location.hash.slice(1));
    let open = null;
    posts.forEach(p => {
      const on = p.id === id;
      p.classList.toggle('open', on);
      if (on) open = p;
    });
    main.classList.toggle('reading', !!open);
    if (open) {
      document.title = open.querySelector('h2').textContent + ' – ' + SITE.name;
      navLinks.forEach(a => {
        if (a.getAttribute('href') === '#blog') a.setAttribute('aria-current', 'true');
        else a.removeAttribute('aria-current');
      });
      window.scrollTo(0, 0);
    } else {
      document.title = baseTitle;
      const t = id && document.getElementById(id);
      if (t) t.scrollIntoView();
    }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
